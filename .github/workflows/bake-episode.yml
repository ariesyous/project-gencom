name: Bake Episode

on:
  schedule:
    # 04:17 UTC daily. Offset from the hour to avoid the top-of-hour GitHub
    # Actions cron rush (same pattern as ariesyous/openfeed).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model slug to use for this run only"
        required: false
        default: "openrouter/free"
        type: choice
        options:
          - "openrouter/free"
          - "openai/gpt-oss-120b"
          - "deepseek/deepseek-v4.1-flash"

permissions:
  contents: write
  actions: write

concurrency:
  group: bake-episode
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bake episode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # openrouter/free is a convenience default for manual test runs only —
          # scheduled bakes use a real named model (same split as
          # ariesyous/openfeed's generate.yml, which hit empty/flaky completions
          # from openrouter/free often enough that production runs avoid it).
          OPENROUTER_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'deepseek/deepseek-v4.1-flash' }}
        run: python bake_episode.py

      - name: Prune old episodes
        run: python prune_episodes.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shows/
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "bake: new episode $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The default GITHUB_TOKEN's pushes don't trigger other workflows' `on:
      # push` (GitHub's loop-prevention), so deploy-pages.yml would otherwise
      # never see this commit — dispatch it explicitly instead.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"
