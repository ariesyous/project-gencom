name: Bake Episode

on:
  schedule:
    # 04:17 UTC daily. Offset from the hour to avoid the top-of-hour GitHub
    # Actions cron rush (same pattern as ariesyous/openfeed).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model slug to use for this run only"
        required: false
        default: "deepseek/deepseek-v4.1-flash"
        type: choice
        options:
          - "deepseek/deepseek-v4.1-flash"
          - "openai/gpt-oss-120b"
          - "openai/gpt-6-luna"
          - "openrouter/free"

permissions:
  contents: write

concurrency:
  group: bake-episode
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bake episode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Default is a real named model. openrouter/free re-picks a random
          # underlying model per call and hit empty/invalid completions often
          # enough (see commit history) that it's opt-in only for now via
          # workflow_dispatch, not the scheduled default.
          OPENROUTER_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'deepseek/deepseek-v4.1-flash' }}
        run: python bake_episode.py

      - name: Prune old episodes
        run: python prune_episodes.py

      # deploy-pages.yml picks this commit up itself via a workflow_run
      # trigger on this workflow's completion (see its comment) — the
      # default GITHUB_TOKEN's pushes don't trigger other workflows' `on:
      # push`, but workflow_run isn't subject to that loop-prevention rule.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shows/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "bake: new episode $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
